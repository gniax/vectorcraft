# iPad port (fork gniax/vectorcraft-ipad): build the web app (WebAssembly), publish it for the iPad app
# (release `ipad-web-latest`, fetched by packaging/ios/fetch-web.sh) and as the public demo on
# GitHub Pages, then check that the Xcode project builds.
name: iPad

on:
  push:
    branches: [ipad]
    paths:
      - "apps/**"
      - "crates/**"
      - "packaging/ios/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ipad.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ipad
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust with the wasm target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ipad-web
      - name: Trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin
          trunk --version
      - name: Build
        working-directory: apps/vectorcraft-web
        run: trunk build --release
      - name: Zip for the iPad app
        run: cd dist/web && zip -qr ../../vectorcraft-web.zip . && cd ../.. && ls -la vectorcraft-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-web
          path: dist/web
      - name: Publish for packaging/ios/fetch-web.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ipad-web-latest >/dev/null 2>&1 || gh release create ipad-web-latest --prerelease --target "$GITHUB_SHA" \
            --title "iPad web build (latest)" --notes "The web build the iPad app bundles. Fetched by packaging/ios/fetch-web.sh; rebuilt on every push to the ipad branch."
          gh release upload ipad-web-latest vectorcraft-web.zip --clobber
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  ios:
    needs: web
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vectorcraft-web
          path: packaging/ios/web
      - name: Build the Xcode project (simulator, unsigned)
        working-directory: packaging/ios
        run: |
          xcodebuild -version
          xcodebuild -project VectorCraft.xcodeproj -target VectorCraft -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test -f build/Debug-iphonesimulator/VectorCraft.app/web/index.html
